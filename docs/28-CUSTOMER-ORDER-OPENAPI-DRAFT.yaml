openapi: 3.1.0
info:
  title: Local Commerce Platform — Customer Orders API
  version: 0.1.0-draft
  summary: Frontend integration contract for the first customer Order slice.
  description: |
    DRAFT — suitable for frontend type generation and mock integration only.
    These routes are not yet implemented as production HTTP endpoints.
    Authentication provider/session lifecycle and deployment-specific abuse limits
    remain undecided. Any changes to this contract require backend implementation
    and contract tests to match it before it is treated as released.
servers:
  - url: /
    description: Relative to the configured API origin.
tags:
  - name: Customer Orders
    description: Customer-owned Order operations.
security:
  - bearerAuth: []
paths:
  /api/v1/orders:
    post:
      tags: [Customer Orders]
      operationId: createCustomerOrder
      summary: Create an Order from the authenticated customer's Cart
      description: |
        Customer identity is derived from the verified server-side principal.
        The request must not contain customerId, prices, totals, or Order status.
        A successful replay with the same Idempotency-Key and request fingerprint
        returns the original logical result, including the original Order ID/number
        and Location header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              cartId: 5c7a3d6a-bfa7-4cc8-a0e4-63a7e3d2a109
      responses:
        '201':
          description: Order created, or the original successful result replayed.
          headers:
            Location:
              description: Relative URL of the created Order resource.
              schema:
                type: string
                example: /api/v1/orders/4c2e1ec5-5f39-4e4c-9e0a-ef6e8b7d1e12
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
              example:
                orderId: 4c2e1ec5-5f39-4e4c-9e0a-ef6e8b7d1e12
                orderNumber: ORD-2026-000123
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Cart is missing or inaccessible to the authenticated customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Resource not found
                status: 404
                code: resource.not_found
                traceId: 00-8f3b4c2a1d6e7f8091a2b3c4d5e6f708-1234567890abcdef-00
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Customer Orders]
      operationId: getCustomerOrder
      summary: Get details for an Order owned by the authenticated customer
      description: |
        A missing Order and an Order owned by another customer return the same
        public 404 response. Delivery is an optional summary of the currently
        active Delivery only; it is null when no active Delivery exists.
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrderDetails'
              example:
                orderId: 4c2e1ec5-5f39-4e4c-9e0a-ef6e8b7d1e12
                orderNumber: ORD-2026-000123
                orderStatus: pending_store_confirmation
                delivery: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Customer Orders]
      operationId: cancelCustomerOrder
      summary: Cancel an eligible Order owned by the authenticated customer
      description: |
        No request body is defined in this version. The server derives the actor
        from the verified principal. Cancellation follows the existing application
        lifecycle rule and also cancels an active Delivery only before pickup.
        Missing and non-owned Orders are proposed to return the same public 404.
        This route-specific concealment mapping must be verified in the HTTP adapter.
        Replaying the same key and request returns the original logical cancellation result.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Order cancellation completed, or original result replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
              example:
                orderId: 4c2e1ec5-5f39-4e4c-9e0a-ef6e8b7d1e12
                deliveryId: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provider-neutral placeholder; the authentication provider and client session flow are not selected.
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Public Order identifier; UUID format.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Proposed syntax: 1–128 visible ASCII characters, opaque and case-sensitive.
        Do not trim or normalize. Same actor + operation + key + same request replays;
        same key with a different request fingerprint returns 409. Final boundary/replay
        behavior remains subject to contract approval and adapter tests.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]{1,128}$'
      example: 7f7c36e8-9df6-4d5a-9c1d-0c9c89e1c7ab
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [cartId]
      properties:
        cartId:
          type: string
          format: uuid
          description: Identifier of the Cart to check out; ownership is checked server-side.
    CreateOrderResponse:
      type: object
      additionalProperties: false
      required: [orderId, orderNumber]
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
          minLength: 1
          description: Human-facing order number generated by the server.
    CustomerOrderDetails:
      type: object
      additionalProperties: false
      required: [orderId, orderNumber, orderStatus, delivery]
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
          minLength: 1
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'
        delivery:
          oneOf:
            - $ref: '#/components/schemas/DeliverySummary'
            - type: 'null'
          description: Current active Delivery summary, or null if none exists.
    DeliverySummary:
      type: object
      additionalProperties: false
      required: [deliveryId, status, assignedAt]
      properties:
        deliveryId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        assignedAt:
          oneOf:
            - type: string
              format: date-time
              description: UTC timestamp in ISO 8601/RFC 3339 format.
            - type: 'null'
    CancelOrderResponse:
      type: object
      additionalProperties: false
      required: [orderId, deliveryId]
      properties:
        orderId:
          type: string
          format: uuid
        deliveryId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: Active Delivery cancelled with the Order, or null if none existed.
    OrderStatus:
      type: string
      description: Stable proposed wire values mapped from the current Domain OrderStatus enum.
      enum:
        - created
        - pending_store_confirmation
        - accepted
        - preparing
        - ready_for_pickup
        - rejected
        - cancelled
    DeliveryStatus:
      type: string
      description: Stable proposed wire values mapped from the current Domain DeliveryStatus enum.
      enum:
        - unassigned
        - assigned
        - picked_up
        - out_for_delivery
        - delivered
        - failed
        - cancelled
    Problem:
      type: object
      description: RFC 9457 Problem Details extended with stable application code and trace ID.
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe user-facing detail; never parse this field for behavior.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - request.invalid
            - request.payload_too_large
            - authentication.required
            - authentication.invalid
            - authorization.forbidden
            - resource.not_found
            - order.invalid_state
            - delivery.invalid_state
            - cart.not_checkoutable
            - catalog.item_unavailable
            - idempotency.key_required
            - idempotency.key_reused
            - idempotency.result_unavailable
            - rate_limit.exceeded
            - dependency.unavailable
            - internal.unexpected
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    BadRequest:
      description: Request JSON, route identifier, or required header is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Invalid request
            status: 400
            code: request.invalid
            traceId: 00-8f3b4c2a1d6e7f8091a2b3c4d5e6f708-1234567890abcdef-00
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Authentication required
            status: 401
            code: authentication.required
            traceId: 00-8f3b4c2a1d6e7f8091a2b3c4d5e6f708-1234567890abcdef-00
    NotFound:
      description: Order is missing or not accessible to this customer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Resource not found
            status: 404
            code: resource.not_found
            traceId: 00-8f3b4c2a1d6e7f8091a2b3c4d5e6f708-1234567890abcdef-00
    Conflict:
      description: Business state conflict or idempotency key reused with a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Request conflicts with current state
            status: 409
            code: idempotency.key_reused
            traceId: 00-8f3b4c2a1d6e7f8091a2b3c4d5e6f708-1234567890abcdef-00
    PayloadTooLarge:
      description: Request body exceeds the configured maximum.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Payload too large
            status: 413
            code: request.payload_too_large
            traceId: 00-8f3b4c2a1d6e7f8091a2b3c4d5e6f708-1234567890abcdef-00
    RateLimited:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds before retry, when supplied by the server.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too many requests
            status: 429
            code: rate_limit.exceeded
            traceId: 00-8f3b4c2a1d6e7f8091a2b3c4d5e6f708-1234567890abcdef-00
    UnexpectedError:
      description: Unexpected failure; no internal details are exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unexpected server error
            status: 500
            code: internal.unexpected
            traceId: 00-8f3b4c2a1d6e7f8091a2b3c4d5e6f708-1234567890abcdef-00
